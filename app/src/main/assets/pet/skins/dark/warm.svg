<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Wizard Claude pet (dark style 6)</title>
  <desc id="desc">A tiny orange square pet with a small wizard hat and wand.  A dark-themed animated version with a rotating, twinkling star and blinking eyes.</desc>
  <!-- Wizard hat and head -->
  <path d="M54 8h20v10h8v10h8v14H38V28h8V18h8V8Z" fill="#110f22" stroke="#090812" stroke-width="4"/>
  <rect x="57" y="20" width="14" height="6" fill="#3d3219"/>
  <!-- Ears -->
  <rect x="39" y="37" width="11" height="20" rx="3" fill="#3a2417" stroke="#25170f" stroke-width="4"/>
  <rect x="78" y="37" width="11" height="20" rx="3" fill="#3a2417" stroke="#25170f" stroke-width="4"/>
  <!-- Body -->
  <rect x="31" y="48" width="66" height="50" rx="4" fill="#392316" stroke="#24160e" stroke-width="4"/>
  <!-- Left arm -->
  <rect x="22" y="61" width="15" height="18" rx="3" fill="#3a2417" stroke="#25170f" stroke-width="4"/>
  <!-- Right arm -->
  <rect x="92" y="57" width="14" height="17" rx="3" fill="#3a2417" stroke="#25170f" stroke-width="4"/>
  <!-- Wand shaft -->
  <rect x="105" y="42" width="5" height="44" fill="#19110e" transform="rotate(20 107.5 64)"/>
  <!-- Wand star: now animated to rotate and twinkle -->
  <rect x="101" y="36" width="13" height="13" fill="#3d3219" transform="rotate(20 107.5 42.5)">
    <!-- Animate colour to create a twinkling effect -->
    <animate attributeName="fill" values="#3d3219;#5b4b25;#3d3219" dur="2s" repeatCount="indefinite"/>
    <!-- Animate rotation about the centre of the star -->
    <animateTransform attributeName="transform" type="rotate" from="20 107.5 42.5" to="380 107.5 42.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Left eye: height and y coordinated to simulate blinking -->
  <rect x="44" y="64" width="9" height="18" rx="2" fill="#070707">
    <animate attributeName="height" values="18;2;18" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="64;71;64" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Right eye: mirror blink animation -->
  <rect x="76" y="64" width="9" height="18" rx="2" fill="#070707">
    <animate attributeName="height" values="18;2;18" keyTimes="0;0.5;1" dur="3s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="64;71;64" keyTimes="0;0.5;1" dur="3s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Mouth -->
  <rect x="58" y="88" width="13" height="4" fill="#1d110c"/>
  <!-- Feet -->
  <rect x="47" y="97" width="7" height="14" fill="#341d12"/>
  <rect x="62" y="97" width="7" height="14" fill="#341d12"/>
  <rect x="77" y="97" width="7" height="14" fill="#341d12"/>
</svg>