<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Animated sleepy Claude pet</title>
  <desc id="desc">A tiny orange square pet sleeping with drifting Z marks.</desc>
  <style>
    .z1 { animation: drift 1.8s steps(4) infinite; }
    .z2 { animation: drift 1.8s steps(4) infinite .45s; opacity:.65; }
    @keyframes drift { 0%{transform:translate(0,8px);opacity:0} 25%,70%{opacity:.72} 100%{transform:translate(10px,-10px);opacity:0} }
  </style>
  <rect x="38" y="22" width="12" height="30" rx="3" fill="#efa06c" stroke="#9e6543" stroke-width="4"/>
  <rect x="78" y="22" width="12" height="30" rx="3" fill="#efa06c" stroke="#9e6543" stroke-width="4"/>
  <rect x="32" y="45" width="64" height="53" rx="4" fill="#ee9360" stroke="#945b3d" stroke-width="4"/>
  <rect x="44" y="35" width="40" height="15" fill="#ee9360"/>
  <rect x="23" y="65" width="14" height="18" rx="3" fill="#efa06c" stroke="#9e6543" stroke-width="4"/>
  <rect x="91" y="65" width="14" height="18" rx="3" fill="#efa06c" stroke="#9e6543" stroke-width="4"/>
  <rect x="43" y="68" width="13" height="4" fill="#2b2b2b"/>
  <rect x="73" y="68" width="13" height="4" fill="#2b2b2b"/>
  <rect x="59" y="82" width="10" height="4" fill="#7e4633"/>
  <rect x="49" y="96" width="7" height="15" fill="#dc7d4e"/>
  <rect x="63" y="96" width="7" height="15" fill="#dc7d4e"/>
  <rect x="76" y="96" width="7" height="15" fill="#dc7d4e"/>
  <g class="z1"><rect x="93" y="25" width="12" height="5" fill="#6b493b"/><rect x="101" y="30" width="5" height="5" fill="#6b493b"/><rect x="93" y="35" width="13" height="5" fill="#6b493b"/></g>
  <g class="z2"><rect x="78" y="13" width="10" height="4" fill="#6b493b"/><rect x="84" y="17" width="4" height="4" fill="#6b493b"/><rect x="78" y="21" width="10" height="4" fill="#6b493b"/></g>
</svg>
