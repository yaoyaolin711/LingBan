<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Animated pink Claude girl ribbon skip</title><desc id="desc">A tiny pink Claude girl pet skipping with braids, ribbons, and a skirt.</desc>
